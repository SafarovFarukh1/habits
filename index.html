<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Один процент</title>
<meta name="description" content="Трекер привычек по книге «Атомные привычки»">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Один процент">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar, bottom sheets for detail and the habit wizard */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#E2E8E5; --fg:#13201B; --muted:#56665F; --line:#D0D9D5;
  --accent:#0B7A62; --accent-ink:#FFFFFF; --accent-soft:#D2ECE4;
  --amber:#B97806; --amber-soft:#FBEED2; --danger:#BF3B27; --danger-soft:#F8DDD7;
  --cell0:#DAE2DE; --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 20px rgba(19,32,27,.06);
  --c1:#2F6FD6;--c1s:#DDE8FB;--c2:#7A4FD0;--c2s:#ECE3FB;--c3:#B97806;--c3s:#FBEED2;--c4:#0B7A62;--c4s:#D2ECE4;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201D; --surface-2:#202B27; --fg:#E3EBE7; --muted:#91A29B; --line:#2A3632;
  --accent:#3CC4A0; --accent-ink:#04211A; --accent-soft:#143A30;
  --amber:#F0B443; --amber-soft:#382C10; --danger:#F07C68; --danger-soft:#3C1E19;
  --cell0:#24302C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --c1:#86AEF2;--c1s:#1B2A44;--c2:#B79DF3;--c2s:#2A2142;--c3:#F0B443;--c3s:#382C10;--c4:#3CC4A0;--c4s:#143A30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201D; --surface-2:#202B27; --fg:#E3EBE7; --muted:#91A29B; --line:#2A3632;
  --accent:#3CC4A0; --accent-ink:#04211A; --accent-soft:#143A30;
  --amber:#F0B443; --amber-soft:#382C10; --danger:#F07C68; --danger-soft:#3C1E19;
  --cell0:#24302C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --c1:#86AEF2;--c1s:#1B2A44;--c2:#B79DF3;--c2s:#2A2142;--c3:#F0B443;--c3s:#382C10;--c4:#3CC4A0;--c4s:#143A30; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.1}
h2{font-size:1.25rem;line-height:1.2}
h3{font-size:1rem;line-height:1.25;font-weight:500}
p{margin:0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.ring{position:relative;width:60px;height:60px;flex:none}
.ring svg{display:block}
.ring .bg{fill:none;stroke:var(--cell0);stroke-width:6}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:.85rem;font-weight:500}

/* banner */
.banner{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--amber-soft);color:var(--fg)}
.banner b{color:var(--amber)}
.banner.danger{background:var(--danger-soft)}
.banner.danger b{color:var(--danger)}
.banner .small{font-size:.85rem;color:var(--muted)}

/* habit cards */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px 12px 12px;box-shadow:var(--shadow)}
.check{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .15s}
.check svg{width:26px;height:26px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.check:hover{border-color:var(--accent)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] svg{opacity:1;transform:scale(1)}
.check.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.15)}100%{transform:scale(1)}}
.hbody{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.hbody:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.hname{font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hcard.done .hname{color:var(--muted)}
.hline{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.hstreak{display:flex;flex-direction:column;align-items:center;min-width:40px}
.hstreak b{font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1}
.hstreak small{font-size:.68rem;color:var(--muted)}
details.later summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600;padding:4px 0;list-style:none}
details.later summary::-webkit-details-marker{display:none}
details.later summary::before{content:"▸ ";}
details.later[open] summary::before{content:"▾ ";}
details.later .list{margin-top:10px;opacity:.75}

/* empty */
.empty{background:var(--surface);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.empty h2{font-size:1.35rem}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.92rem;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:none;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger);color:#fff}
.btn.link{background:none;color:var(--accent);padding:8px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.stat b{font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}
.sheet .stat{background:var(--surface-2);box-shadow:none}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:3px;align-items:center}
.heat .lbl{font-size:.62rem;color:var(--muted);padding-right:4px;line-height:1}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--cell0);border:none;padding:0;width:100%}
.heat .c.on{background:var(--accent)}
.heat .c.miss{background:var(--cell0);box-shadow:inset 0 0 0 1.5px var(--danger-soft)}
.heat .c.off{background:transparent;box-shadow:inset 0 0 0 1px var(--cell0)}
.heat .c.fut{visibility:hidden}
.heat .c.today{outline:2px solid var(--fg);outline-offset:1px}
.heat button.c{cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--cell0)}
.legend i.on{background:var(--accent)}
.legend i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--cell0)}

.pcard{all:unset;cursor:pointer;background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pcard-h .meta{font-size:.8rem;color:var(--muted);white-space:nowrap}
.sync{font-size:.8rem;color:var(--muted);text-align:center}
.toggle{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:12px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.toggle span{display:flex;flex-direction:column;gap:2px}
.toggle small{font-size:.8rem;color:var(--muted)}
.alarm-wrap{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:fade .2s ease}
.alarm{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:16px}
.al-top{display:flex;align-items:baseline;gap:12px}
.al-time{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1;color:var(--accent)}
.al-time.ringing{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.alarm h1{font-size:2rem}
.al-min{font-size:1.05rem;color:var(--muted)}
.quote{margin:4px 0;background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.quote blockquote{margin:0;font-family:var(--display);font-weight:500;font-size:1.2rem;line-height:1.4;text-wrap:balance}
.quote figcaption{font-size:.82rem;color:var(--muted)}
.al-warn{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.92rem}
.al-actions,.al-skip{display:flex;flex-direction:column;gap:10px}
.al-skip label{font-size:.95rem}
.btn.big{padding:17px;font-size:1.08rem}
.al-skiplink{color:var(--muted);font-weight:500;font-size:.9rem}

.backup{gap:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1;min-width:140px;text-align:center}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

/* guide */
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero-num{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.hero-num div{display:flex;flex-direction:column}
.hero-num b{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.hero-num b.up{color:var(--accent)}
.hero-num b.down{color:var(--danger)}
.hero-num span{font-size:.8rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .t{fill:var(--muted);font-size:9px;font-family:var(--body)}
.chart .up{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .down{fill:none;stroke:var(--danger);stroke-width:2.5}
.chart .lu{fill:var(--accent);font-size:10px;font-weight:700;font-family:var(--body)}
.chart .ld{fill:var(--danger);font-size:10px;font-weight:700;font-family:var(--body)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:500;font-size:.85rem;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.steps b{display:block}
.steps p{font-size:.92rem;color:var(--muted)}
.law-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.law-h .eyebrow{font-size:.68rem}
.law-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.law-cols div{border-radius:12px;padding:10px;font-size:.86rem;min-width:0}
.law-cols .g{background:var(--accent-soft)}
.law-cols .b{background:var(--danger-soft)}
.law-cols strong{display:block;margin-bottom:3px;font-size:.9rem}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.ideas b{display:block}
.ideas span{color:var(--muted);font-size:.92rem}
@media (max-width:420px){.law-cols{grid-template-columns:1fr}}

/* tab bar & fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:none;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.74rem;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(calc(16px + env(safe-area-inset-right,0px)),calc((100vw - 560px)/2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:28px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(11,122,98,.35)}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.sheet-b{overflow-y:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px;stroke:var(--fg);stroke-width:2.2;fill:none;stroke-linecap:round}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--cell0)}
.dots i.on{background:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.field .help{font-size:.8rem;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:1rem}
.input:focus{outline:none;border-color:var(--accent)}
.prefix{display:flex;align-items:center;gap:8px}
.prefix span{font-weight:600;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:.95rem}
.opt span{font-size:.8rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days .chip{padding:7px 0;width:42px;text-align:center}
.hint{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--fg)}
.hint b{color:var(--accent)}
.plan{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:.92rem;padding-bottom:8px;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:none}
.plan li span:first-child{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.ident{font-family:var(--display);font-weight:500;font-size:1.05rem;line-height:1.35}
.confirm{background:var(--danger-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm .row{display:flex;gap:8px}
.confirm .row .btn{flex:1}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(144px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:up .25s ease}

button,label,a,summary{-webkit-tap-highlight-color:transparent}
button,label{touch-action:manipulation}
.sheet{will-change:transform}
.sheet.wiz{height:88%;max-height:820px}
.overlay.closing{animation:fadeout .22s ease forwards;pointer-events:none}
.overlay.closing .sheet{animation:down .22s ease forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes down{to{transform:translateY(70px);opacity:0}}
.sheet-b.in-fwd{animation:infwd .24s cubic-bezier(.2,.8,.2,1)}
.sheet-b.in-back{animation:inback .24s cubic-bezier(.2,.8,.2,1)}
@keyframes infwd{from{opacity:0;transform:translateX(22px)}}
@keyframes inback{from{opacity:0;transform:translateX(-22px)}}
.view{animation:fade .2s ease}
.dots i{transition:background-color .3s ease}
.hcard{transition:background-color .2s}
.hname,.hstreak b{transition:color .2s}
.resetd{margin-left:auto;margin-right:8px;font-size:.85rem;padding:6px 0}
.fill{align-self:flex-start;border:none;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.8rem;padding:6px 11px;border-radius:999px}
.toast.out{animation:fadeout .26s ease forwards}

/* onboarding */
.hello{background:var(--surface);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hello h2{font-size:1.4rem}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mini li{display:flex;gap:12px;align-items:center}
.mini i{font-style:normal;font-family:var(--display);font-weight:500;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.mini .n1{background:var(--c1s);color:var(--c1)}.mini .n2{background:var(--c2s);color:var(--c2)}.mini .n3{background:var(--c4s);color:var(--c4)}
.mini b,.stepcards b,.howto b{display:block;font-size:.98rem}
.mini span,.howto li>span:last-child{font-size:.88rem;color:var(--muted)}
.mini b,.howto b{color:var(--fg)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.chip.bad{border-color:var(--danger-soft)}
.tip{background:var(--c1s);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tip b{color:var(--c1)}
.btn.small{padding:8px 14px;font-size:.88rem;background:var(--c1);color:#fff;margin-top:4px}
/* range switch + calendars */
.rseg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.rseg.two{grid-template-columns:1fr 1fr}
.rseg button{border:none;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.88rem;color:var(--muted);transition:background-color .2s,color .2s}
.rseg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sheet .rseg{background:var(--bg)}
.cw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cwd,.cmd{border:none;font:inherit;color:var(--fg);background:var(--cell0);transition:background-color .2s,color .2s}
.cwd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;min-height:50px;justify-content:center}
.cwd small{font-size:.64rem;color:var(--muted);font-weight:600}
.cwd b{font-size:.95rem;font-variant-numeric:tabular-nums}
.cm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cmh{font-size:.64rem;color:var(--muted);text-align:center;font-weight:600}
.cmd{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-size:.82rem;padding:0;font-variant-numeric:tabular-nums}
.pcard .cm{max-width:320px}
.pcard .cmd{font-size:.72rem;border-radius:7px}
.cwd.on,.cmd.on{background:var(--accent);color:var(--accent-ink)}
.cwd.on small{color:inherit;opacity:.8}
.cwd.miss,.cmd.miss{background:var(--danger-soft)}
.cwd.off,.cmd.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.cwd.fut,.cmd.fut{background:transparent;color:var(--muted);opacity:.55}
.cwd.today,.cmd.today{box-shadow:inset 0 0 0 2px var(--fg)}
button.cwd,button.cmd{cursor:pointer}
.cy{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(53,1fr);gap:2px}
.cy i{aspect-ratio:1;border-radius:1.5px;background:var(--cell0)}
.cy i.on{background:var(--accent)}.cy i.miss{background:var(--danger-soft)}.cy i.off{background:transparent}.cy i.fut{visibility:hidden}
.legend i.miss{background:var(--danger-soft)}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav b{font-size:.95rem}
.calnav .x:disabled{opacity:.3}
.calnav .x svg{stroke:var(--fg);stroke-width:2.2;fill:none}
/* guide */
.cta{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 20px;box-shadow:0 8px 24px rgba(11,122,98,.25)}
.cta:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.cta span{display:flex;flex-direction:column;gap:2px}
.cta b{font-family:var(--display);font-weight:500;font-size:1.05rem}
.cta small{opacity:.85;font-size:.85rem}
.cta svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gsec{display:flex;flex-direction:column;gap:12px}
.stepcards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepcards li{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.stepcards li:last-child{grid-column:1/-1;flex-direction:row;align-items:center}
.stepcards i{font-style:normal;font-family:var(--display);font-weight:500;font-size:.8rem;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.stepcards span{font-size:.84rem;color:var(--muted);line-height:1.35}
.stepcards b{color:var(--fg);margin-bottom:2px}
.c1 i,.c1 .li,.hi.c1{background:var(--c1s);color:var(--c1)}
.c2 i,.c2 .li,.hi.c2{background:var(--c2s);color:var(--c2)}
.c3 i,.c3 .li,.hi.c3{background:var(--c3s);color:var(--c3)}
.c4 i,.c4 .li,.hi.c4{background:var(--c4s);color:var(--c4)}
.laws{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.law{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:5px;min-width:0;border-top:none;animation:fade .25s ease}
.law.c1{background:var(--c1s)}.law.c2{background:var(--c2s)}.law.c3{background:var(--c3s)}.law.c4{background:var(--c4s)}
.law .li{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface)!important;margin-bottom:4px}
.law .li svg,.hi svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.law b{font-size:.95rem;line-height:1.25}
.law p{font-size:.82rem;color:var(--fg);opacity:.75;line-height:1.35}
.law .eyebrow{font-size:.64rem}
.ideas2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ideas2 div{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.ideas2 .c1{background:var(--c1s)}.ideas2 .c2{background:var(--c2s)}.ideas2 .c3{background:var(--c3s)}.ideas2 .c4{background:var(--c4s)}
.ideas2 b{font-family:var(--display);font-weight:700;font-size:1.35rem}
.ideas2 .c1 b{color:var(--c1)}.ideas2 .c2 b{color:var(--c2)}.ideas2 .c3 b{color:var(--c3)}.ideas2 .c4 b{color:var(--c4)}
.ideas2 span{font-size:.82rem;line-height:1.35}
.howto{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.howto li{display:flex;gap:12px;align-items:flex-start}
.hi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
@media (max-width:360px){.stepcards,.laws,.ideas2{grid-template-columns:1fr}}

.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}
.check.pop{animation:pop2 .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
.check.pop::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--accent);animation:ring .55s ease-out forwards;pointer-events:none}
.check{position:relative}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
.hstreak b.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:translateY(-6px) scale(1.25);color:var(--accent)}}
.ms{position:fixed;inset:0;z-index:110;background:rgba(8,14,12,.55);display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left,0px));animation:fade .25s ease}
.ms.out{animation:fadeout .25s ease forwards}
.ms-card{background:var(--surface);border-radius:28px;padding:28px 24px;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:msin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes msin{from{transform:scale(.7) translateY(30px);opacity:0}}
.ms-num{font-family:var(--display);font-weight:700;font-size:5.5rem;line-height:1;color:var(--accent)}
.ms-unit{font-family:var(--display);font-weight:500;font-size:1.05rem;margin-top:-4px}
.ms-card p{color:var(--muted);font-size:.95rem;margin-top:6px}
.ms-card .ms-id{color:var(--fg);font-weight:600}
.ms-card .btn{margin-top:12px;width:100%}
.delf{flex-direction:column;align-items:stretch;gap:10px;background:var(--danger-soft);animation:fade .2s ease}
.delf b{font-size:.95rem}
.delf .row{display:flex;gap:10px}
.delf .row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<main class="app">
  <section class="view" id="v-today" aria-label="Сегодня"></section>
  <section class="view" id="v-progress" aria-label="Прогресс" hidden></section>
  <section class="view" id="v-guide" aria-label="Методика" hidden></section>
</main>

<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Привычка</button>

<nav class="tabs" aria-label="Разделы">
  <div class="tabs-in">
    <button class="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg>Сегодня</button>
    <button class="tab" data-tab="progress" type="button"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Прогресс</button>
    <button class="tab" data-tab="guide" type="button"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/></svg>Методика</button>
  </div>
</nav>
<div id="layer"></div>
<div id="alarm"></div>

<script>
(function(){
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WDF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const ALL=[0,1,2,3,4,5,6];
const LS='one-percent-v1';

const TPL={
 build:[
  {label:'Чтение',f:{name:'Читать',identity:'человек, который читает каждый день',cueMode:'stack',after:'налью утренний кофе',tiny:'прочитать 1 страницу',prep:'положить книгу рядом с кофеваркой',bundle:'',reward:'допить кофе с книгой и отметить день'}},
  {label:'Спорт',f:{name:'Тренировка',identity:'человек, который не пропускает тренировки',cueMode:'stack',after:'вернусь домой с работы',tiny:'переодеться в форму и сделать 5 приседаний',prep:'сложить форму у двери с вечера',bundle:'слушаю любимый подкаст только во время тренировки',reward:'душ и отметка в трекере',days:[0,2,4]}},
  {label:'Английский',f:{name:'Английский',identity:'человек, который каждый день говорит по-английски',cueMode:'time',time:'08:30',where:'в транспорте',tiny:'выучить 3 слова',prep:'приложение на первом экране телефона',bundle:'',reward:''}},
  {label:'Медитация',f:{name:'Медитация',identity:'спокойный человек, который управляет вниманием',cueMode:'stack',after:'почищу зубы утром',tiny:'1 минута спокойного дыхания',prep:'таймер на 1 минуту в избранном',bundle:'',reward:''}},
  {label:'Вода',f:{name:'Стакан воды',identity:'человек, который заботится о теле',cueMode:'stack',after:'проснусь',tiny:'выпить стакан воды',prep:'поставить графин и стакан у кровати',bundle:'',reward:''}},
  {label:'Дневник',f:{name:'Дневник',identity:'человек, который осмысляет свой день',cueMode:'stack',after:'лягу в кровать',tiny:'написать одну строчку о дне',prep:'блокнот и ручка на тумбочке',bundle:'',reward:''}}
 ],
 brk:[
  {label:'Соцсети',f:{name:'Меньше соцсетей',identity:'человек, который сам управляет своим вниманием',trigger:'скука и паузы, телефон в руке',invisible:'убрать приложения с главного экрана, телефон в другой комнате во время работы',hard:'выйти из аккаунтов, лимит экранного времени 30 минут',stake:'',replace:'открыть книгу или выйти на 5 минут пройтись'}},
  {label:'Сладкое',f:{name:'Без сладкого',identity:'человек, который ест осознанно',trigger:'стресс и сладости на виду',invisible:'не держать сладкое дома, обходить кондитерский отдел',hard:'покупать только одну порцию за раз',stake:'',replace:'фрукты или чай с орехами'}},
  {label:'Телефон в кровати',f:{name:'Без телефона перед сном',identity:'человек, который высыпается',trigger:'телефон рядом с подушкой',invisible:'заряжать телефон на кухне',hard:'блокировка приложений после 23:00',stake:'',replace:'10 минут бумажной книги'}}
 ]
};

let S={v:1,habits:[],log:{}};
let tab='today', sheet=null, draft=null, step=0, confirmDel=false;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function wd(d){return (d.getDay()+6)%7}
function uid(){return Math.random().toString(36).slice(2,10)}
function plural(n,a,b,c){const m=n%10,h=n%100;if(m===1&&h!==11)return a;if(m>=2&&m<=4&&(h<12||h>14))return b;return c}
const today=()=>new Date();

/* ---------- habit logic ---------- */
function done(h,k){return !!(S.log[h.id]&&S.log[h.id][k])}
function sched(h,d){return (h.days||ALL).includes(wd(d))&&dk(d)>=h.created}
function streak(h){
  let d=today(),n=0;
  if(!done(h,dk(d)))d=add(d,-1);
  for(let i=0;i<2000;i++){const k=dk(d);if(k<h.created)break;if(done(h,k))n++;else if(sched(h,d))break;d=add(d,-1)}
  return n;
}
function best(h){let cur=0,b=0,d=pd(h.created);const t=dk(today());for(let i=0;i<4000&&dk(d)<=t;i++){const k=dk(d);if(done(h,k)){cur++;b=Math.max(b,cur)}else if(sched(h,d)&&k!==t)cur=0;d=add(d,1)}return b}
function votes(h){return Object.keys(S.log[h.id]||{}).length}
function missState(h){
  if(done(h,dk(today())))return null;
  const miss=[];let d=add(today(),-1);
  for(let i=0;i<21&&miss.length<2;i++){if(dk(d)<h.created)break;if(sched(h,d))miss.push(!done(h,dk(d)));d=add(d,-1)}
  if(miss[0]&&miss[1])return 'twice';
  if(miss[0])return 'once';
  return null;
}
function daysText(days){days=(days||ALL).slice().sort();if(days.length===7)return 'каждый день';if(days.join()==='0,1,2,3,4')return 'по будням';if(days.join()==='5,6')return 'по выходным';return days.map(i=>DAYS[i]).join(', ')}
function cueText(h){
  if(h.type==='brk')return h.replace?'Вместо этого: '+h.replace:(h.trigger?'Триггер: '+h.trigger:'');
  if(h.cueMode==='time')return [h.time?(h.alarm!==false?'⏰ ':'')+h.time:'',h.where].filter(Boolean).join(' · ');
  return h.after?'После того как я '+h.after:'';
}
function planRows(h){
  const r=[];
  if(h.identity)r.push(['Кто я',(h.type==='brk'?'Я — ':'Я — ')+h.identity]);
  if(h.type==='brk'){
    if(h.trigger)r.push(['Триггер',h.trigger]);
    if(h.invisible)r.push(['Невидимо',h.invisible]);
    if(h.hard)r.push(['Трудно',h.hard]);
    if(h.stake)r.push(['Неприятно',h.stake]);
    if(h.replace)r.push(['Замена',h.replace]);
  }else{
    const act=h.tiny||h.name;
    if(h.cueMode==='time'){if(h.time||h.where)r.push(['Когда',[h.time?'в '+h.time:'',h.where].filter(Boolean).join(', ')]);if(h.time&&h.alarm!==false)r.push(['Будильник','в '+h.time+', со звуком, пока приложение открыто'])}
    else if(h.after)r.push(['Когда','После того как я '+h.after+', я '+act.charAt(0).toLowerCase()+act.slice(1)]);
    if(h.tiny)r.push(['Минимум',h.tiny]);
    if(h.prep)r.push(['Подготовка',h.prep]);
    if(h.bundle)r.push(['Связка',h.bundle]);
    if(h.reward)r.push(['Награда',h.reward]);
  }
  r.push(['Дни',daysText(h.days)]);
  return r;
}

/* ---------- persistence ---------- */
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.habits))return o}}catch(e){}return null}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Не получилось сохранить. Освободи место на телефоне.')}}
function syncLabel(){return 'Данные хранятся только на этом телефоне. Раз в пару недель делай бэкап.'}

/* ---------- backup ---------- */
let pendingImport=null;
function backupCard(){
  return `<div class="card backup">
    <h3>Бэкап</h3>
    <p class="muted" style="font-size:.88rem">Сохрани файл с привычками в «Файлы» или iCloud. Пригодится при смене телефона или если очистишь данные Safari.</p>
    <div class="row2"><button class="btn ghost" type="button" data-export>Сохранить бэкап</button><label class="btn ghost filebtn" for="importFile">Загрузить бэкап</label></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    ${pendingImport?`<div class="confirm"><b>Заменить текущие данные?</b><span style="font-size:.88rem">В файле ${pendingImport.habits.length} ${plural(pendingImport.habits.length,'привычка','привычки','привычек')}. Сейчас у тебя ${S.habits.length}. Текущие данные будут заменены.</span><div class="row"><button class="btn danger" type="button" data-import-yes>Заменить</button><button class="btn ghost" type="button" data-import-no>Отмена</button></div></div>`:''}
  </div>`;
}
async function doExport(){
  const json=JSON.stringify({app:'one-percent',v:1,exported:new Date().toISOString(),habits:S.habits,log:S.log},null,1);
  const name='один-процент-'+dk(today())+'.json';
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Бэкап привычек'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Файл сохранён в загрузки')}
  catch(e){try{await navigator.clipboard.writeText(json);toast('Бэкап скопирован как текст')}catch(_){toast('Не получилось сохранить бэкап')}}
}
document.addEventListener('change',e=>{
  if(e.target.id!=='importFile')return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.habits))throw 0;pendingImport={habits:o.habits,log:o.log||{}};renderProgress()}catch(_){toast('Это не файл бэкапа «Одного процента»')}};
  r.readAsText(f);e.target.value='';
});

/* ---------- render: today ---------- */
function ring(doneN,total){
  const C=2*Math.PI*24,p=total?doneN/total:0;
  return `<div class="ring" aria-label="Выполнено ${doneN} из ${total}"><svg viewBox="0 0 60 60" width="60" height="60"><circle class="bg" cx="30" cy="30" r="24"/><circle class="fg" cx="30" cy="30" r="24" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-p)).toFixed(2)}" transform="rotate(-90 30 30)"/></svg><span class="num">${doneN}/${total}</span></div>`;
}
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function card(h,k){
  const isD=done(h,k),ms=missState(h),st=streak(h),line=cueText(h);
  let tags='';
  if(h.type==='brk')tags+='<span class="tag">Бросаю</span>';

/* ---------- heatmap ---------- */
function heat(h,weeks,interactive){
  const t=today(),tk=dk(t);
  const end=add(t,6-wd(t)),start=add(end,-(weeks*7-1));
  let cells='';
  ['Пн','','Ср','','Пт','','Вс'].forEach(l=>cells+=`<span class="lbl">${l}</span>`);
  for(let i=0;i<weeks*7;i++){
    const d=add(start,i),k=dk(d);
    let cls='c';
    if(k>tk)cls+=' fut';
    else if(done(h,k))cls+=' on';
    else if(sched(h,d)&&k<tk)cls+=' miss';
    else if(!sched(h,d))cls+=' off';
    if(k===tk)cls+=' today';
    const lab=`${d.getDate()} ${MONTHS[d.getMonth()]}${done(h,k)?', выполнено':''}`;
    cells+=(interactive&&k<=tk)?`<button type="button" class="${cls}" data-day="${k}" aria-label="${lab}"></button>`:`<span class="${cls}" title="${lab}"></span>`;
  }
  return `<div class="heat" style="grid-template-columns:auto repeat(${weeks},1fr)">${cells}</div>`;
}

const MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let range=(()=>{try{return localStorage.getItem('one-percent-range')||'week'}catch(e){return 'week'}})();

function tipSeen(){try{return localStorage.getItem('one-percent-tip')==='1'}catch(e){return true}}
function setRange(r){range=r;calOff=0;try{localStorage.setItem('one-percent-range',r)}catch(e){}}
function rangeSeg(){return `<div class="rseg" role="tablist" aria-label="Вид календаря">${[['week','Неделя'],['month','Месяц'],['year','Год']].map(a=>`<button type="button" role="tab" data-range="${a[0]}" aria-selected="${range===a[0]}">${a[1]}</button>`).join('')}</div>`}
function cellCls(h,d,tk){const k=dk(d);let c;if(k>tk)c='fut';else if(done(h,k))c='on';else if(!sched(h,d))c='off';else if(k<tk)c='miss';else c='todo';if(k===tk)c+=' today';return c}
function dayLab(d,h){return `${d.getDate()} ${MONTHS[d.getMonth()]}${done(h,dk(d))?', выполнено':''}`}
function calWeek(h,inter,off){
  const t=today(),tk=dk(t),st=add(t,-wd(t)+7*off);let o='<div class="cw">';
  for(let i=0;i<7;i++){const d=add(st,i),k=dk(d),c=cellCls(h,d,tk),can=inter&&k<=tk;
    o+=can?`<button type="button" class="cwd ${c}" data-day="${k}" aria-label="${dayLab(d,h)}"><small>${DAYS[i]}</small><b>${d.getDate()}</b></button>`:`<span class="cwd ${c}" title="${dayLab(d,h)}"><small>${DAYS[i]}</small><b>${d.getDate()}</b></span>`}
  return o+'</div>';
}
function calMonth(h,inter,off){
  const t=today(),tk=dk(t),f=new Date(t.getFullYear(),t.getMonth()+off,1),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
  let o=`<div class="cm">${DAYS.map(x=>`<span class="cmh">${x}</span>`).join('')}`;
  for(let i=0;i<wd(f);i++)o+='<span></span>';
  for(let n=1;n<=dim;n++){const d=new Date(f.getFullYear(),f.getMonth(),n),k=dk(d),c=cellCls(h,d,tk),can=inter&&k<=tk;
    o+=can?`<button type="button" class="cmd ${c}" data-day="${k}" aria-label="${dayLab(d,h)}">${n}</button>`:`<span class="cmd ${c}">${n}</span>`}
  return o+'</div>';
}
function calYear(h){
  const t=today(),tk=dk(t),end=add(t,6-wd(t)),st=add(end,-(53*7-1));let o='<div class="cy" aria-label="Год">';
  for(let i=0;i<53*7;i++){o+=`<i class="${cellCls(h,add(st,i),tk)}"></i>`}
  return o+'</div>';
}
function cal(h,inter,off){off=off||0;return range==='week'?calWeek(h,inter,off):range==='month'?calMonth(h,inter,off):calYear(h)}
function calTitle(off){const t=today();if(range==='week'){if(!off)return 'Эта неделя';const a=add(t,-wd(t)+7*off),b=add(a,6);return `${a.getDate()} ${MONTHS[a.getMonth()]} — ${b.getDate()} ${MONTHS[b.getMonth()]}`}if(range==='month'){const f=new Date(t.getFullYear(),t.getMonth()+off,1);return MONTHS_N[f.getMonth()]+(f.getFullYear()!==t.getFullYear()?' '+f.getFullYear():'')}return 'Последние 12 месяцев'}

function topicFor(){
  if(!draft)return null;
  const words=String(draft.name||'').toLowerCase().replace(/ё/g,'е').split(/[^a-zа-я0-9]+/).filter(Boolean);
  if(!words.length)return null;
  const t=draft.type==='brk'?'brk':'build';
  for(const tp of TOPICS){if(tp[t]&&tp.k.some(k=>words.some(w=>w.startsWith(k))))return tp[t]}
  return null;
}
function sg(f){const m=topicFor();const t=draft&&draft.type==='brk'?'brk':'build';return (m&&m[f])||GEN[t][f]||''}
function lc(x){x=String(x||'');return x?x.charAt(0).toLowerCase()+x.slice(1):x}


/* ---------- draft autosave ---------- */
const DLS='one-percent-draft';
function hasContent(d){return !!(d&&['name','identity','after','time','where','tiny','prep','bundle','reward','trigger','invisible','hard','stake','replace'].some(f=>String(d[f]||'').trim()))}
function saveDraftLocal(open){if(!draft||draft.id)return;try{if(!hasContent(draft)){localStorage.removeItem(DLS);return}localStorage.setItem(DLS,JSON.stringify({d:draft,step,open:open!==false,ts:Date.now()}))}catch(e){}}
function loadDraftLocal(){try{const o=JSON.parse(localStorage.getItem(DLS)||'null');if(o&&o.d&&hasContent(o.d)&&Date.now()-o.ts<14*864e5)return o}catch(e){}return null}
function clearDraftLocal(){try{localStorage.removeItem(DLS)}catch(e){}}

/* ---------- wizard ---------- */
function blank(type){return {id:null,type:type||'build',name:'',identity:'',cueMode:'stack',after:'',time:'',where:'',alarm:true,days:ALL.slice(),tiny:'',prep:'',bundle:'',reward:'',trigger:'',invisible:'',hard:'',stake:'',replace:''}}
function stepsFor(t){return t==='brk'?['start','what','invisible','hard','replace','review']:['start','what','obvious','easy','attractive','review']}
function openWizard(opts){
  opts=opts||{};
  if(opts.edit){const h=S.habits.find(x=>x.id===opts.edit);draft=Object.assign(blank(h.type),JSON.parse(JSON.stringify(h)));step=1}
  else{draft=blank(opts.type);step=0;if(opts.tpl){applyTpl(opts.tpl);step=1}else{const o=loadDraftLocal();if(o){draft=Object.assign(blank(o.d.type),o.d);draft.id=null;step=Math.min(o.step||0,stepsFor(draft.type).length-1);if(!opts.silent)setTimeout(()=>toast('Продолжаем черновик'),300)}}}
  sheet={kind:'wizard'};renderSheet();
}
function applyTpl(code){const p=code.split(':'),t=TPL[p[0]][+p[1]];const keep=draft.id;draft=Object.assign(blank(p[0]),JSON.parse(JSON.stringify(t.f)));draft.id=keep;if(!t.f.days)draft.days=ALL.slice()}
function fillBtn(f){const v=sg(f);return v&&f!=='name'?`<button type="button" class="fill" data-fill="${f}" ${draft[f]?'hidden':''}>Подставить пример</button>`:''}
function fld(f,label,ph,help){const p=f==='name'?ph:(sg(f)||ph);return `<div class="field"><label for="w-${f}">${label}</label><input class="input" id="w-${f}" data-f="${f}" value="${esc(draft[f])}" placeholder="${esc(p)}" autocomplete="off" autocorrect="on" autocapitalize="${f==='name'?'sentences':'none'}">${help?`<span class="help">${help}</span>`:''}${fillBtn(f)}</div>`}
function daysPicker(){return `<div class="field"><label>В какие дни</label><div class="days">${DAYS.map((d,i)=>`<button type="button" class="chip" data-day-t="${i}" aria-pressed="${draft.days.includes(i)}">${d}</button>`).join('')}</div></div>`}
function stepHTML(s){
  const brk=draft.type==='brk';
  switch(s){
  case 'start':return `<h2>Что хочешь изменить?</h2>

    <div class="hint"><b>Идентичность.</b> ${brk?'Сравни: «я пытаюсь бросить» и «я не курю». Во втором случае ты уже другой человек, а не борешься с собой.':'Цель не прочитать книгу, а стать читателем. Каждое выполнение — голос за эту версию тебя. Голоса копятся в трекере.'}</div>`;
  case 'obvious':return `<h2>Сделай очевидной</h2>
    <div class="seg"><button type="button" class="opt" data-mode="stack" aria-pressed="${draft.cueMode==='stack'}"><b>После другой привычки</b><span>лучше всего работает</span></button><button type="button" class="opt" data-mode="time" aria-pressed="${draft.cueMode==='time'}"><b>Время и место</b><span>чёткий план</span></button></div>
    ${draft.cueMode==='stack'?fld('after','После того как я…','налью утренний кофе','Выбери то, что ты и так делаешь каждый день в одно время.'):`<div class="field"><label for="w-time">Во сколько</label><input class="input" type="time" id="w-time" data-f="time" value="${esc(draft.time)}">${sg('time')?`<button type="button" class="fill" data-fill="time" ${draft.time?'hidden':''}>Подставить ${esc(sg('time'))}</button>`:''}</div>${fld('where','Где','дома в кресле')}<label class="toggle" for="w-alarm"><input type="checkbox" id="w-alarm" data-fc="alarm" ${draft.alarm!==false?'checked':''}><span><b>Будильник в это время</b><small>Звук и экран с мотивацией. Отключить его можно, только прочитав цитату.</small></span></label>`}

  case 'easy':return `<h2>Сделай лёгкой</h2>

  const t=today(),k=dk(t),st=alarmState();
  return S.habits.filter(h=>!h.archived&&h.type!=='brk'&&h.cueMode==='time'&&h.alarm!==false&&h.time&&sched(h,t)&&!done(h,k))
    .filter(h=>{const m=minsSince(h.time);if(m<0||m>180)return false;const v=st.m[h.id];if(v==='off')return false;if(typeof v==='number'&&Date.now()<v)return false;return true})
    .sort((a,b)=>a.time<b.time?-1:1);
}
function checkAlarms(withSound){
  if(alarmFor||(sheet&&sheet.kind==='wizard'))return;
  const d=dueAlarms();if(!d.length)return;
  alarmFor=d[0].id;skipMode=false;
  let i;do{i=Math.floor(Math.random()*QUOTES.length)}while(i===lastQ&&QUOTES.length>1);lastQ=i;alarmQuote=QUOTES[i];
  renderAlarm();if(withSound)startSound();
}
function skipPhrase(){const h=S.habits.find(x=>x.id===alarmFor);return h&&missState(h)==='once'?'я пропускаю второй день подряд':'завтра я вернусь'}
function renderAlarm(){
  const box=$('#alarm');const h=S.habits.find(x=>x.id===alarmFor);
  if(!h){box.innerHTML='';alarmFor=null;stopSound();return}
  const second=missState(h)==='once';
  const inner=`<div class="alarm" role="alertdialog" aria-modal="true" aria-labelledby="al-name">
    <div class="al-top"><span class="al-time num${beepTimer?' ringing':''}">${esc(h.time)}</span><span class="eyebrow">Пора</span></div>
    <h1 id="al-name">${esc(h.name)}</h1>
    ${h.tiny?`<p class="al-min">Минимум: ${esc(h.tiny)}</p>`:''}
    <figure class="quote"><blockquote>${esc(alarmQuote.t)}</blockquote>${alarmQuote.s?`<figcaption>${esc(alarmQuote.s)}</figcaption>`:''}</figure>
    ${second?'<p class="al-warn">Вчера эта привычка уже была пропущена.</p>':''}
    ${skipMode?`<div class="al-skip"><label for="al-phrase">Чтобы пропустить, напиши: <b>${esc(skipPhrase())}</b></label><input class="input" id="al-phrase" autocomplete="off" autocapitalize="off"><div class="row2"><button class="btn danger" type="button" id="al-skip-ok" data-al="skip-ok" disabled>Пропустить</button><button class="btn ghost" type="button" data-al="skip-no">Нет, сделаю</button></div></div>`:
    `<div class="al-actions"><button class="btn big" type="button" data-al="start">Начинаю</button><div class="row2"><button class="btn ghost" type="button" data-al="done">Уже сделал</button><button class="btn ghost" type="button" data-al="snooze">Через 10 минут</button></div><button class="btn link al-skiplink" type="button" data-al="skip">Пропустить сегодня</button></div>`}
  </div>`;
  const w=box.querySelector('.alarm-wrap');if(w)w.innerHTML=inner;else box.innerHTML=`<div class="alarm-wrap">${inner}</div>`;
  document.body.style.overflow='hidden';
  if(skipMode){const i=$('#al-phrase');if(i)i.focus()}
}
function closeAlarm(){stopSound();alarmFor=null;skipMode=false;$('#alarm').innerHTML='';if(!sheet)document.body.style.overflow='';setTimeout(()=>checkAlarms(false),400)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-al]');if(!b||!alarmFor)return;
  const a=b.dataset.al,id=alarmFor;stopSound();
  if(a==='start'){setAlarmState(id,'off');closeAlarm();toast('Две минуты. Поехали. Отметь, когда закончишь.')}
  else if(a==='done'){setAlarmState(id,'off');closeAlarm();if(!done(S.habits.find(x=>x.id===id),dk(today())))toggle(id,dk(today()))}
  else if(a==='snooze'){setAlarmState(id,Date.now()+10*60000);closeAlarm();toast('Напомню через 10 минут, если приложение будет открыто')}
  else if(a==='skip'){skipMode=true;renderAlarm()}
  else if(a==='skip-no'){skipMode=false;renderAlarm()}
  else if(a==='skip-ok'){setAlarmState(id,'off');closeAlarm();toast('Ок. Завтра без вариантов.')}
});
setInterval(()=>checkAlarms(true),15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>checkAlarms(false),500)});
setTimeout(()=>checkAlarms(false),800);

/* ---------- boot ---------- */
const local=loadLocal();if(local)S={v:1,habits:local.habits,log:local.log||{}};
renderGuide();render();
const h0=(location.hash||'').slice(1);setTab(['today','progress','guide'].includes(h0)?h0:'today');
let lastDay=dk(today());
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(sheet&&sheet.kind==='wizard')saveDraftLocal(true)}else if(dk(today())!==lastDay){lastDay=dk(today());render()}});
window.addEventListener('pagehide',()=>{if(sheet&&sheet.kind==='wizard')saveDraftLocal(true)});
{const o=loadDraftLocal();if(o&&o.open){openWizard({silent:true});setTimeout(()=>toast('Черновик привычки восстановлен'),400)}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
